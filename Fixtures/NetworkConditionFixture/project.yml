name: NetworkConditionFixture
options:
  bundleIdPrefix: com.simpilot
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  NetworkConditionFixture:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Network Condition Fixture
        CFBundleURLTypes:
          - CFBundleURLName: com.simpilot.NetworkConditionFixture
            CFBundleURLSchemes:
              - networkfixture
        NSLocationWhenInUseUsageDescription: Location is used to verify Simulator test controls.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simpilot.NetworkConditionFixture
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
